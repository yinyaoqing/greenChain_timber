name: Keepalive

on:
  schedule:
    # 每 10 分鐘 ping 一次，防 Render 免費方案 15 分鐘閒置休眠（R3）
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend healthz
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
            https://greenchain-backend-mp5a.onrender.com/healthz)
          echo "healthz -> HTTP $code"
          test "$code" = "200"
